name: Sync upstream

on:
  schedule:
    - cron: '23 20 * * 5' # Friday 20:23 UTC: 21:23 Rome winter / 22:23 summer.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-master
  cancel-in-progress: false

jobs:
  sync:
    name: Sync master from the original repository
    if: github.event.repository.fork == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # GitHub discovers the upstream repository from the fork relationship.
      # Conflicts fail the run; fork commits are never forcefully overwritten.
      - name: Sync master
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/${GH_REPO}/merge-upstream" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -f branch=master
